name: TrialVault RL Gym CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-mutants:
    name: Ruff, Harbor Lint, Boundary Scores & 30-Mutant Kill Suite (2 Tasks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --python 3.12 --no-install-project
      - name: Ruff lint
        run: uv run --python 3.12 ruff check .
      - name: Starter baseline EDC & PV tests
        run: |
          PYTHONPATH=tasks/trialvault-consent-withdrawal/environment/workspace \
            uv run --python 3.12 pytest -v tasks/trialvault-consent-withdrawal/environment/workspace/tests/test_baseline_edc.py
          PYTHONPATH=tasks/trialvault-sae-expedited-reporting/environment/workspace \
            uv run --python 3.12 pytest -v tasks/trialvault-sae-expedited-reporting/environment/workspace/tests/test_baseline_pv.py
      - name: Verifier boundary & 30-mutant kill suite (18 consent + 12 SAE)
        run: uv run --python 3.12 pytest -v
      - name: Harbor static lint (with root-agent rule) on all tasks
        run: |
          uvx --python 3.12 harbor lint --extend-select root-agent tasks/trialvault-consent-withdrawal
          uvx --python 3.12 harbor lint --extend-select root-agent tasks/trialvault-sae-expedited-reporting

  web-build:
    name: Workbench UI Type-Check & Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install & build Vercel workbench
        working-directory: web
        run: npm install --no-audit --no-fund && npm run build

  harbor-docker-oracle:
    name: Dockerized Harbor Separate-Verifier Oracle (${{ matrix.task }})
    runs-on: ubuntu-latest
    needs: lint-and-mutants
    strategy:
      fail-fast: false
      matrix:
        task:
          - trialvault-consent-withdrawal
          - trialvault-sae-expedited-reporting
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Verify Docker is ready
        run: docker info --format '{{.ServerVersion}}'
      - name: Harbor NOP agent (must score 0.0)
        run: |
          uvx --python 3.12 harbor run \
            -p tasks/${{ matrix.task }} \
            -a nop \
            --jobs-dir jobs/nop
          python3 -c '
          import json, glob
          files = glob.glob("jobs/nop/**/reward.json", recursive=True)
          assert files, "No reward.json found for nop"
          data = json.loads(open(files[0]).read())
          print("NOP reward.json:", data)
          assert data["reward"] == 0.0, f"Expected 0.0, got {data}"
          '
      - name: Harbor Oracle SOLUTION=1 (must score 1.0)
        run: |
          uvx --python 3.12 harbor run \
            -p tasks/${{ matrix.task }} \
            -a oracle \
            --ae SOLUTION=1 \
            --jobs-dir jobs/sol1
          python3 -c '
          import json, glob
          files = glob.glob("jobs/sol1/**/reward.json", recursive=True)
          assert files, "No reward.json found for sol1"
          data = json.loads(open(files[0]).read())
          print("SOLUTION=1 reward.json:", data)
          assert data["reward"] == 1.0, f"Expected 1.0, got {data}"
          '
      - name: Harbor Oracle SOLUTION=2 (must score 1.0)
        run: |
          uvx --python 3.12 harbor run \
            -p tasks/${{ matrix.task }} \
            -a oracle \
            --ae SOLUTION=2 \
            --jobs-dir jobs/sol2
          python3 -c '
          import json, glob
          files = glob.glob("jobs/sol2/**/reward.json", recursive=True)
          assert files, "No reward.json found for sol2"
          data = json.loads(open(files[0]).read())
          print("SOLUTION=2 reward.json:", data)
          assert data["reward"] == 1.0, f"Expected 1.0, got {data}"
          '
