schema_version = "1.4"
artifacts = ["/app"]

[task]
name = "praneeth16/trialvault-consent-withdrawal"
description = "Implement HIPAA Safe Harbor consent withdrawal across multi-database clinical EDC, CDISC SDTM warehouse, and signed site monitoring stores without breaking FDA 21 CFR Part 11 audit chains or safety endpoints."
authors = [{ name = "Praneeth Paikray", email = "paiky1995@gmail.com" }]
keywords = [
    "hls",
    "healthcare",
    "clinical-trials",
    "hipaa",
    "21-cfr-part-11",
    "backend",
    "distributed-systems",
]

[metadata]
category = "healthcare-life-sciences"
difficulty = "hard"
difficulty_explanation = "Combines 7 interacting brownfield patterns across separate SQLite databases and file stores (edc.db, part11_audit.db, cdisc_sdtm.db, search.db, cache, blobs/manifests, DSMB exports, site enrollment/SDV logs, ePRO spools): Safe Harbor de-identification (restricted ZIP3, >89 age bucketing, aliases/initials), 21 CFR Part 11 separate-ledger hash chain, ICH E6 follow_up_only vs full scope escalation, FDA pre/post specimen boundary, cross-DB concurrent workers, and late-stage audit-ledger fault recovery."

[metadata.harbor.lint]
extend-select = ["root-agent"]

[agent]
timeout_sec = 1800.0
user = "agent"

[environment]
network_mode = "no-network"
cpus = 2
memory_mb = 4096
storage_mb = 8192
workdir = "/app"

[verifier]
environment_mode = "separate"
network_mode = "no-network"
timeout_sec = 300.0
